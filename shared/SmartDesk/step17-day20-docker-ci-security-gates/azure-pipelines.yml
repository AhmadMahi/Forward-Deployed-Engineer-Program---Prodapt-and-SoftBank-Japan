# SmartDesk CI with security gates (Day 20). Any gate failure stops the build.
trigger: { branches: { include: [main] } }
pr: { branches: { include: [main] } }
pool: { vmImage: ubuntu-latest }

stages:
  - stage: SecurityGates
    jobs:
      - job: scan
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: "3.12" }
          - script: pip install bandit pip-audit pytest fastapi httpx
            displayName: Install tools
          - script: bandit -r app -ll
            displayName: SAST (bandit)
          - script: pip-audit -r requirements.txt --strict
            displayName: Dependency scan (pip-audit)
          - script: |
              docker run --rm -v "$(Build.SourcesDirectory):/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner
            displayName: Secret scan (gitleaks)
          - script: pytest -q
            displayName: Tests

  - stage: Build
    dependsOn: SecurityGates
    jobs:
      - job: image
        steps:
          - script: docker build -t smartdesk-api:$(Build.BuildId) .
            displayName: Build image
          - script: |
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL smartdesk-api:$(Build.BuildId)
            displayName: Image scan (trivy)
